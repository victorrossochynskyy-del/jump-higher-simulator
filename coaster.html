<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Coaster Park 3D</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:Arial,sans-serif;background:#87ceeb}
body{user-select:none}
canvas{position:fixed;inset:0;display:block}
#hud{position:fixed;top:14px;left:14px;display:flex;gap:8px;z-index:5}
.stat{padding:8px 12px;min-width:96px;background:#102544dd;border:1px solid #ffffff55;border-radius:12px;color:#fff}
.stat small{display:block;color:#aee5ff;font-size:10px;font-weight:bold}
.stat b{font-size:19px}
button{border:0;border-radius:12px;font-weight:bold;cursor:pointer}
#rideBtns{position:fixed;top:14px;right:14px;display:flex;gap:8px;z-index:5}
#rideBtns button{background:#142b50;color:#fff;padding:12px 16px;box-shadow:0 5px 15px #0005}
#menu{position:fixed;inset:0;background:#0009;display:grid;place-items:center;z-index:10;padding:16px}
#menu.hidden{display:none}
#cards{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;max-width:1100px;max-height:92vh;overflow:auto}
.card{width:250px;background:linear-gradient(#17345d,#09172e);color:#fff;border-radius:18px;padding:20px;box-shadow:0 15px 50px #000}
.card h2{margin:0 0 4px;font-size:22px}
.card .type{color:#7ce2ff;font-size:12px;font-weight:bold}
.card p{color:#b8cce4;font-size:13px;min-height:56px}
.card .stats{font-size:12px;color:#fff;background:#ffffff12;border-radius:10px;padding:8px;margin-bottom:12px}
.card button{width:100%;padding:13px;background:#7ce2ff;color:#102544;font-size:16px}
#menuTitle{text-align:center;color:#fff;margin:0 0 16px;font-size:34px;text-shadow:0 4px 12px #000}
@media(max-width:600px){.stat{min-width:76px}.stat b{font-size:15px}}
</style>
</head>
<body>

<div id="hud">
  <div class="stat"><small>SPEED</small><b id="speed">0 km/h</b></div>
  <div class="stat"><small>HEIGHT</small><b id="cheight">0m</b></div>
  <div class="stat"><small>G-FORCE</small><b id="gforce">1.0g</b></div>
  <div class="stat"><small>RIDE TIME</small><b id="rtime">0s</b></div>
</div>
<div id="launchMsg" style="display:none;position:fixed;top:70px;left:50%;transform:translateX(-50%);font-size:34px;font-weight:900;color:#7dff8a;text-shadow:0 3px 10px #000;z-index:6;pointer-events:none;white-space:nowrap"></div>
<div id="rideBtns">
  <button id="camBtn">🎥 CAM</button>
  <button id="soundBtn">🔊 SOUND</button>
  <button id="stopBtn">⏹ EXIT</button>
</div>

<div id="done" style="display:none;position:fixed;inset:0;background:#0009;z-index:11;place-items:center;padding:16px">
  <div class="card" style="text-align:center">
    <h2>🏁 Ride Complete!</h2>
    <div class="stats" id="doneStats"></div>
    <button id="doneBtn" style="width:100%;padding:13px;background:#7ce2ff;color:#102544;font-size:16px">BACK TO PARK</button>
  </div>
</div>
<div id="menu">
  <div>
    <h1 id="menuTitle">🎢 Coaster Park 3D</h1>
    <div id="cards"></div>
  </div>
</div>

<script>
const $=id=>document.getElementById(id);

// ============================== AUDIO ==============================
let audioCtx=null,windGain=null,windFilter=null,soundOn=true;
function initAudio(){
  if(!audioCtx){
    try{
      audioCtx=new(window.AudioContext||window.webkitAudioContext)();
      // looping wind noise
      const len=audioCtx.sampleRate*1.5,buf=audioCtx.createBuffer(1,len,audioCtx.sampleRate);
      const d=buf.getChannelData(0);
      for(let i=0;i<len;i++)d[i]=Math.random()*2-1;
      const src=audioCtx.createBufferSource();src.buffer=buf;src.loop=true;
      windFilter=audioCtx.createBiquadFilter();windFilter.type="lowpass";windFilter.frequency.value=300;
      windGain=audioCtx.createGain();windGain.gain.value=0;
      src.connect(windFilter);windFilter.connect(windGain);windGain.connect(audioCtx.destination);
      src.start();
    }catch(e){}
  }
  if(audioCtx&&audioCtx.state==="suspended")audioCtx.resume();
}
addEventListener("touchstart",()=>initAudio(),{passive:true});
function tone(f0,f1,dur,type="sine",vol=.15){
  if(!audioCtx||!soundOn)return;
  try{
    const o=audioCtx.createOscillator(),g=audioCtx.createGain();
    o.type=type;o.frequency.setValueAtTime(f0,audioCtx.currentTime);
    o.frequency.exponentialRampToValueAtTime(Math.max(1,f1),audioCtx.currentTime+dur);
    g.gain.setValueAtTime(vol,audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+dur);
    o.connect(g);g.connect(audioCtx.destination);
    o.start();o.stop(audioCtx.currentTime+dur);
  }catch(e){}
}
function clack(){tone(170,120,.05,"square",.12);setTimeout(()=>tone(150,100,.05,"square",.1),90)}
function chainRattle(){tone(95,70,.06,"square",.08)}
function scream(){tone(750+Math.random()*300,350,.7,"sawtooth",.07)}

// ============================== SCENE ==============================
const scene=new THREE.Scene();
scene.background=new THREE.Color(0x87ceeb);
scene.fog=new THREE.Fog(0x87ceeb,80,400);
const camera=new THREE.PerspectiveCamera(65,innerWidth/innerHeight,.1,1000);
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio||1,2));
document.body.appendChild(renderer.domElement);
addEventListener("resize",()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
scene.add(new THREE.HemisphereLight(0xcfeaff,0x4da64d,1));
const sun=new THREE.DirectionalLight(0xffffff,.8);sun.position.set(40,80,30);scene.add(sun);

const ground=new THREE.Mesh(new THREE.PlaneGeometry(800,800),new THREE.MeshLambertMaterial({color:0x55a755}));
ground.rotation.x=-Math.PI/2;scene.add(ground);
const lake=new THREE.Mesh(new THREE.CircleGeometry(28,32),new THREE.MeshLambertMaterial({color:0x3a9bdc}));
lake.rotation.x=-Math.PI/2;lake.position.set(-70,.05,-120);scene.add(lake);

// trees + clouds
const trunkMat=new THREE.MeshLambertMaterial({color:0x6b4a2b});
const leafMat=new THREE.MeshLambertMaterial({color:0x2e7d32});
for(let i=0;i<70;i++){
  const t=new THREE.Group();
  const trunk=new THREE.Mesh(new THREE.CylinderGeometry(.3,.45,2,6),trunkMat);trunk.position.y=1;t.add(trunk);
  const c1=new THREE.Mesh(new THREE.ConeGeometry(2,4,8),leafMat);c1.position.y=4;t.add(c1);
  const c2=new THREE.Mesh(new THREE.ConeGeometry(1.4,3,8),leafMat);c2.position.y=6;t.add(c2);
  let px=(Math.random()-.5)*260,pz=40-Math.random()*320;
  if(Math.abs(px)<38&&pz<25&&pz>-260){px+=px<0?-45:45}
  t.position.set(px,0,pz);t.scale.setScalar(.8+Math.random()*.9);scene.add(t);
}
const cloudMat=new THREE.MeshLambertMaterial({color:0xffffff,transparent:true,opacity:.85});
for(let i=0;i<12;i++){
  const c=new THREE.Group();
  for(let j=0;j<3;j++){
    const s=new THREE.Mesh(new THREE.SphereGeometry(3+Math.random()*3,10,8),cloudMat);
    s.position.set(j*5-5,Math.random()*2,Math.random()*4);s.scale.y=.55;c.add(s);
  }
  c.position.set((Math.random()-.5)*300,55+Math.random()*30,-50-Math.random()*250);
  scene.add(c);
}

// station platform (all coasters start near origin heading -z)
(function station(){
  const g=new THREE.Group();
  const plat=new THREE.Mesh(new THREE.BoxGeometry(7,.6,26),new THREE.MeshLambertMaterial({color:0x8d8d8d}));
  plat.position.set(5.5,2.4,7);g.add(plat);
  const roof=new THREE.Mesh(new THREE.BoxGeometry(8,.4,27),new THREE.MeshLambertMaterial({color:0xb33939}));
  roof.position.set(5.5,7.5,7);g.add(roof);
  for(const [px,pz] of [[2.2,-5],[8.8,-5],[2.2,19],[8.8,19]]){
    const post=new THREE.Mesh(new THREE.CylinderGeometry(.25,.25,5.4,8),new THREE.MeshLambertMaterial({color:0x555555}));
    post.position.set(px,4.9,pz);g.add(post);
  }
  const sign=new THREE.Mesh(new THREE.BoxGeometry(10,2,.4),new THREE.MeshLambertMaterial({color:0xffd84d}));
  sign.position.set(5.5,9,20);g.add(sign);
  scene.add(g);
})();

// ============================== TRACKS ==============================
function cork(pts,x0,y0,z0,len,r,n){
  for(let k=0;k<=n;k++){const a=k/n*Math.PI*2;pts.push([x0+r*Math.sin(a),y0-r*Math.cos(a),z0-len*k/n])}
}
const COASTERS=[
 {id:"loop",name:"Sky Loop",type:"STEEL • LOOPING",thrill:"★★★★☆",inv:1,
  desc:"Classic out-and-back with a towering 7m vertical loop. Pure old-school adrenaline.",
  pts:[[0,3,20],[0,3,2],[0,3,-14],[0,8,-30],[0,15,-46],[0,20,-60],[0,20.5,-68],[0,12,-80],[0,5,-88],[0,3.5,-93]]},
 {id:"cork",name:"Double Corkscrew",type:"STEEL • INVERSIONS",thrill:"★★★★★",inv:2,
  desc:"Two back-to-back 360° corkscrew rolls after a steep first drop. Hang on tight!",
  pts:[[0,3,20],[0,3,2],[0,3,-14],[0,9,-30],[0,16,-48],[0,17,-58],[0,8,-72],[0,4,-82],[0,3.5,-87]]},
 {id:"hyper",name:"Sky Piercer Hyper",type:"STEEL • HYPERCOASTER",thrill:"★★★★★",inv:0,
  desc:"45m lift hill, a near-vertical first drop and giant airtime camelbacks. Tallest in the park.",
  pts:[[0,3,20],[0,3,2],[0,6,-14],[0,14,-32],[0,26,-50],[0,38,-66],[0,45,-78],[0,44,-86],[0,30,-98],[0,12,-110],[0,5,-122],[0,5,-132],[0,13,-146],[0,6,-160],[0,4,-172],[0,5,-184],[0,11,-196],[0,5,-208],[2,4,-220],[10,4,-230],[18,3,-232],[24,3,-222],[26,3,-205],[24,3,-180],[22,3,-150],[20,3,-110],[20,3,-70],[20,3,-40],[20,3,-10],[20,3,20],[20,3,45]]},
 {id:"twist",name:"Timber Twister",type:"WOODEN • TWISTER",thrill:"★★★★☆",inv:0,
  desc:"Rattling wooden twister with wild banked S-turns through the trees. No loops, all speed.",
  pts:[[0,3,20],[0,3,2],[0,6,-16],[0,10,-34],[6,9,-50],[-2,8,-64],[-10,7,-78],[-4,6,-92],[4,6,-106],[12,5,-118],[6,4,-132],[-4,4,-146],[-12,4,-160],[-6,5,-174],[2,6,-186],[10,5,-196],[18,4,-204],[26,3,-200],[30,3,-180],[30,3,-140],[30,3,-100],[30,3,-60],[28,3,-30],[26,3,0],[26,3,25],[26,3,45]]},
 {id:"kid",name:"Junior Cruiser",type:"FAMILY • GENTLE",thrill:"★★☆☆☆",inv:0,
  desc:"A gentle scenic ride for the little ones. Slow, smooth, no surprises.",
  pts:[[0,2.5,14],[0,2.5,0],[0,2.5,-20],[0,3.5,-42],[0,3.5,-62],[2,3,-80],[8,2.5,-92],[16,2.5,-98],[22,2.5,-94],[25,2.5,-84],[25,2.5,-62],[23,2.5,-40],[21,2.5,-18],[20,2.5,2],[20,2.5,20]]},
 {id:"toro",name:"El Toro",type:"WOODEN • AIRTIME BEAST",thrill:"★★★★★",lift:13,
  desc:"Relentless wooden twister: 76-degree first drop, ejector-airtime camelbacks, savage S-turns.",
  pts:[[0,3,20],[0,3,2],[0,8,-16],[0,20,-36],[0,32,-58],[0,40,-78],[0,24,-90],[0,6,-102],[0,4,-116],[0,16,-132],[0,6,-148],[0,13,-162],[0,5,-176],[0,10,-188],[0,4,-200],[10,4,-212],[20,5,-218],[28,4,-212],[34,3,-200],[34,3,-180],[34,6,-160],[34,4,-140],[34,7,-120],[34,4,-100],[34,3,-70],[34,3,-40],[34,3,-10],[34,3,20],[34,3,45]]},
 {id:"ka",name:"Kingda Ka",type:"LAUNCH • STRATA COASTER",thrill:"★★★★★",launch:{until:130,target:62},
  desc:"Hydraulic launch to 200 km/h straight up a 139m top hat, then a 90-degree straight-down drop.",
  pts:[[0,3,20],[0,3,2],[0,3,-20],[0,3,-40],[0,3,-60],[0,8,-80],[0,30,-95],[0,70,-105],[0,110,-112],[0,139,-118],[0,142,-126],[0,138,-134],[0,100,-142],[0,50,-148],[0,10,-154],[0,4,-165],[4,4,-178],[12,5,-188],[24,4,-192],[30,3,-182],[30,3,-140],[30,3,-100],[30,3,-60],[30,3,-20],[30,3,10],[30,3,40]]}
];
// programmatic inversions
(function(){
  const loop=COASTERS[0].pts;
  for(let k=0;k<=10;k++){const a=Math.PI+k/10*Math.PI*2;loop.push([0,10.5+7*Math.cos(a),-100+7*Math.sin(a)])}
  loop.push([0,4,-109],[2,5,-121],[8,5,-131],[16,4,-135],[16,3,-110],[16,3,-70],[16,3,-35],[16,3,0],[16,3,25],[16,3,45]);
  const c=COASTERS[1].pts;
  cork(c,0,6.5,-91,24,2.5,10);
  c.push([0,3.5,-121],[0,3.5,-127]);
  cork(c,0,6.5,-129,24,2.5,10);
  c.push([0,4,-161],[3,4,-173],[10,4,-181],[16,3,-178],[16,3,-140],[16,3,-100],[16,3,-60],[16,3,-32],[16,3,0],[16,3,25],[16,3,45]);
})();

const railMat=new THREE.MeshLambertMaterial({color:0xd23c3c});
const woodMat=new THREE.MeshLambertMaterial({color:0x8a5a2b});
const tieMat=new THREE.MeshLambertMaterial({color:0x5d3d1c});
const supMat=new THREE.MeshLambertMaterial({color:0x777777});
const cache={};

function computeTrack(def){
  if(cache[def.id])return cache[def.id];
  const curve=new THREE.CatmullRomCurve3(def.pts.map(p=>new THREE.Vector3(p[0],p[1],p[2])),false,"catmullrom",.08);
  const N=1400;
  const spaced=curve.getSpacedPoints(N); // N+1 points, open point-to-point: station one end, terminus the other
  // gentle smoothing passes iron out kinks so the ride isn't crooked (endpoints fixed)
  for(let k=0;k<3;k++){
    const src=spaced.map(p=>p.clone());
    for(let i=1;i<N;i++)spaced[i].copy(src[i].multiplyScalar(.5).addScaledVector(src[i-1],.25).addScaledVector(src[i+1],.25));
  }
  // cumulative length
  const cum=[0];
  for(let i=1;i<=N;i++){const a=spaced[i-1],b=spaced[i];cum.push(cum[i-1]+a.distanceTo(b))}
  const L=cum[N],ds=L/N;
  // tangents
  const T=[];
  for(let i=0;i<=N;i++){const a=spaced[Math.max(0,i-1)],b=spaced[Math.min(N,i+1)];T.push(b.clone().sub(a).normalize())}
  // parallel-transport up/side frames (stable through loops)
  const UP=[],SIDE=[];let up=new THREE.Vector3(0,1,0);
  for(let i=0;i<=N;i++){
    const t=T[i];
    let u=up.clone().sub(t.clone().multiplyScalar(up.dot(t)));
    if(u.lengthSq()<1e-6)u=new THREE.Vector3(1,0,0).sub(t.clone().multiplyScalar(t.x));
    u.normalize();UP.push(u);
    SIDE.push(new THREE.Vector3().crossVectors(t,u).normalize());
    up=u;
  }
  // (heavy meshes are built on demand by buildMeshes - see below)
  // lift-hill end = first big peak (for chain-lift zone)
  let peakI=0;for(let i=0;i<N*.35;i++)if(spaced[i].y>spaced[peakI].y)peakI=i;
  const built={group:null,spaced,T,UP,SIDE,L,ds,N,sLift:peakI*ds,
    maxH:Math.max(...spaced.map(p=>p.y)),len:L,isWood:["twist","toro"].includes(def.id),id:def.id,lift:def.lift||9,launch:def.launch||null};
  // inversions: count transitions into upside-down
  let inv=0,wasUp=true;
  for(let i=0;i<=N;i+=10){const u=UP[i].y<0;if(u&&wasUp){inv++;wasUp=false}if(!u)wasUp=true}
  built.inv=inv;
  cache[def.id]=built;
  return built;
}

// Heavy meshes are only built when you actually ride (keeps the menu fast)
// beam between two points (for tower lattice work)
function beamBetween(a,b,r,mat){
  const d=new THREE.Vector3().subVectors(b,a),len=d.length();
  const m=new THREE.Mesh(new THREE.CylinderGeometry(r,r,len,6),mat);
  m.position.copy(a).addScaledVector(d,.5);
  m.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0),d.normalize());
  return m;
}
function buildMeshes(built){
  if(built.group)return built.group;
  const spaced=built.spaced,T=built.T,UP=built.UP,SIDE=built.SIDE,N=built.N,isWood=built.isWood;
  const supStep=(built.id==="toro"||built.id==="twist")?24:46; // woodies pack bents close together
  const g=new THREE.Group();
  // rails (smooth parallel pair, offset to the sides)
  const SCHEMES={
    loop:{rail:0xd23c3c,sup:0xf2f2f2},
    cork:{rail:0x2255cc,sup:0xf2f2f2},
    hyper:{rail:0xffb300,sup:0xeeeeee},
    twist:{rail:0x8a5a2b,sup:0x6b4a2b},
    kid:{rail:0x22aa55,sup:0xeeeeee},
    toro:{rail:0x7a4a22,sup:0x5d3d1c},
    ka:{rail:0x35b558,sup:0x232f4a}
  };
  const SCH=SCHEMES[built.id]||SCHEMES.loop;
  const railM=new THREE.MeshLambertMaterial({color:SCH.rail});
  const supM=new THREE.MeshLambertMaterial({color:SCH.sup});
  for(const sd of [-0.55,0.55]){
    const rp=spaced.map((p,i)=>p.clone().addScaledVector(SIDE[i],sd).addScaledVector(UP[i],.15));
    g.add(new THREE.Mesh(
      new THREE.TubeGeometry(new THREE.CatmullRomCurve3(rp,false),500,.13,6,false),
      isWood?woodMat:railM));
  }
  // center spine beam (steel coasters, like the real tubular-track ones)
  if(!isWood){
    const spine=spaced.map((p,i)=>p.clone().addScaledVector(UP[i],-.55));
    g.add(new THREE.Mesh(
      new THREE.TubeGeometry(new THREE.CatmullRomCurve3(spine,false),400,.24,6,false),
      railM));
  }
  // sleepers
  const tieGeo=new THREE.BoxGeometry(1.5,.14,.34);
  const m4=new THREE.Matrix4();
  for(let i=0;i<=N;i+=9){
    const tie=new THREE.Mesh(tieGeo,tieMat);
    const xA=new THREE.Vector3().crossVectors(UP[i],T[i]).normalize();
    const yA=new THREE.Vector3().crossVectors(T[i],xA).normalize();
    m4.makeBasis(xA,yA,T[i]);
    tie.quaternion.setFromRotationMatrix(m4);
    tie.position.copy(spaced[i]).addScaledVector(UP[i],-.05);
    g.add(tie);
  }
  // supports (white A-frames; skipped wherever they'd stab another rail section or the station)
  for(let i=0;i<=N;i+=supStep){
    const p=spaced[i],h=p.y-.4;
    if(h<1.5)continue;
    if(Math.abs(p.x)<4&&p.z>-10&&p.z<24&&p.y<8)continue; // station area
    let bang=false;
    for(let j=0;j<=N;j+=4){
      const d=Math.abs(j-i);if(d<40)continue; // same section (open track, no wrap)
      const q=spaced[j];
      const t=Math.max(0,Math.min(1,q.y/h));
      const dx=p.x-q.x,dz=p.z-q.z,dy=t*h-q.y;
      if(dx*dx+dz*dz+dy*dy<2.4*2.4){bang=true;break}
    }
    if(bang)continue;
    const spread=1.5,legL=Math.sqrt(spread*spread+h*h),lean=Math.atan(spread/h);
    for(const sgn of [-1,1]){
      const leg=new THREE.Mesh(new THREE.CylinderGeometry(.2,.3,legL,8),supM);
      leg.position.set(p.x+sgn*spread/2,h/2,p.z);
      leg.rotation.z=sgn*lean;
      g.add(leg);
      const foot=new THREE.Mesh(new THREE.BoxGeometry(1.2,.5,1.2),supM);
      foot.position.set(p.x+sgn*spread,h*.02,p.z);g.add(foot);
    }
    const bar=new THREE.Mesh(new THREE.CylinderGeometry(.14,.14,3,6),supM);
    bar.rotation.z=Math.PI/2;bar.position.set(p.x,h*.55,p.z);g.add(bar);
  }
  // Kingda Ka tower: navy corner columns + green lattice rings around the top hat
  if(built.id==="ka"){
    const navyM=new THREE.MeshLambertMaterial({color:0x232f4a});
    const grnM=new THREE.MeshLambertMaterial({color:0x35b558});
    for(const px of [-6,6])for(const pz of [-92,-138]){
      const col=new THREE.Mesh(new THREE.CylinderGeometry(.6,.9,142,8),navyM);
      col.position.set(px,71,pz);g.add(col);
      const foot=new THREE.Mesh(new THREE.BoxGeometry(2.4,.8,2.4),navyM);
      foot.position.set(px,.4,pz);g.add(foot);
    }
    const corners=[[-6,-92],[6,-92],[6,-138],[-6,-138]];
    let lvl=0;
    for(let yy=10;yy<140;yy+=13){
      for(let k=0;k<4;k++){
        const a=corners[k],b=corners[(k+1)%4];
        g.add(beamBetween(new THREE.Vector3(a[0],yy,a[1]),new THREE.Vector3(b[0],yy,b[1]),.28,grnM));
      }
      const d0=corners[lvl%4],d1=corners[(lvl%4+1)%4];lvl++;
      g.add(beamBetween(new THREE.Vector3(d0[0],yy-6.5,d0[1]),new THREE.Vector3(d1[0],yy+6.5,d1[1]),.18,grnM));
    }
    // launch fins along the flat launch straight
    const finM=new THREE.MeshLambertMaterial({color:0x555555});
    for(let fz=14;fz>=-56;fz-=10){
      const fin=new THREE.Mesh(new THREE.BoxGeometry(.5,.7,2.2),finM);
      fin.position.set(0,3.4,fz);g.add(fin);
    }
  }
  // terminus platform + FINISH sign (the start side has the main station)
  {
    const e=spaced[N],te=T[N];
    const seH=new THREE.Vector3(te.z,0,-te.x).normalize();
    const yaw=Math.atan2(te.x,te.z);
    const eplat=new THREE.Mesh(new THREE.BoxGeometry(7,.6,20),new THREE.MeshLambertMaterial({color:0x8d8d8d}));
    eplat.position.set(e.x+seH.x*4.5,e.y-.3,e.z+seH.z*4.5);eplat.rotation.y=yaw;g.add(eplat);
    for(const off of [-6,6]){
      const post=new THREE.Mesh(new THREE.CylinderGeometry(.25,.25,4.5,8),supM);
      post.position.set(e.x+seH.x*4.5+te.x*off,(e.y-.3)+2.5,e.z+seH.z*4.5+te.z*off);g.add(post);
    }
    const roof=new THREE.Mesh(new THREE.BoxGeometry(8,.4,22),new THREE.MeshLambertMaterial({color:0xb33939}));
    roof.position.set(e.x+seH.x*4.5,(e.y-.3)+4.8,e.z+seH.z*4.5);roof.rotation.y=yaw;g.add(roof);
    const sign=new THREE.Mesh(new THREE.BoxGeometry(7,1.8,.4),new THREE.MeshLambertMaterial({color:0xffd84d}));
    sign.position.set(e.x+seH.x*4.5,(e.y-.3)+6,e.z+seH.z*4.5);sign.rotation.y=yaw;g.add(sign);
  }
  built.group=g;
  return g;
}

// ============================== TRAIN ==============================
const shirtColors=[0x2e7de3,0x2ecc71,0xffb300,0xe33e3e,0x9b59b6,0x1abc9c,0xff6b9d,0x00bcd4];
const train=[];
function buildCart(ci,isLead){
  const cart=new THREE.Group();
  const M=c=>new THREE.MeshLambertMaterial({color:c});
  const carColor=0xdd2222;
  // chassis, bogies and wheels gripping the rails
  const ch=new THREE.Mesh(new THREE.BoxGeometry(1.2,.3,2.6),M(0x222222));ch.position.y=.6;cart.add(ch);
  for(const bz of [-.9,.9]){
    const bog=new THREE.Mesh(new THREE.BoxGeometry(1.1,.25,.5),M(0x333333));bog.position.set(0,.45,bz);cart.add(bog);
    for(const wx of [-.55,.55])for(const wz of [-.18,.18]){
      const wh=new THREE.Mesh(new THREE.CylinderGeometry(.16,.16,.1,10),M(0x111111));
      wh.rotation.z=Math.PI/2;wh.position.set(wx,.3,bz+wz);cart.add(wh);
    }
  }
  // body tub with white stripe
  const base=new THREE.Mesh(new THREE.BoxGeometry(1.6,.55,2.8),M(carColor));base.position.y=1;cart.add(base);
  const stripe=new THREE.Mesh(new THREE.BoxGeometry(1.64,.14,2.84),M(0xffffff));stripe.position.y=1.08;cart.add(stripe);
  if(isLead){
    // nose cone + headlight
    const nose=new THREE.Mesh(new THREE.ConeGeometry(.7,1,4),M(carColor));
    nose.rotation.x=Math.PI/2;nose.rotation.y=Math.PI/4;nose.scale.set(1.15,.5,1);nose.position.set(0,1,1.9);cart.add(nose);
    const lamp=new THREE.Mesh(new THREE.SphereGeometry(.12,8,8),new THREE.MeshBasicMaterial({color:0xfff6c0}));
    lamp.position.set(0,1.15,2.35);cart.add(lamp);
  }else{
    const back=new THREE.Mesh(new THREE.BoxGeometry(1.6,.8,.25),M(0x222222));back.position.set(0,1.5,-1.3);cart.add(back);
  }
  // two rows of riders, arms up
  for(const rz of [-.55,.55]){
    const seat=new THREE.Mesh(new THREE.BoxGeometry(1.3,.5,.5),M(0x222222));seat.position.set(0,1.25,rz);cart.add(seat);
    const rest=new THREE.Mesh(new THREE.BoxGeometry(1.3,.55,.18),M(0x222222));rest.position.set(0,1.5,rz-.3);cart.add(rest);
    for(const sx of [-.33,.33]){
      const sh=shirtColors[(ci*2+(sx>0?1:0)+(rz>0?4:0))%shirtColors.length];
      const torso=new THREE.Mesh(new THREE.CylinderGeometry(.2,.24,.55,8),M(sh));torso.position.set(sx,1.62,rz);cart.add(torso);
      const hd=new THREE.Mesh(new THREE.SphereGeometry(.19,10,8),M(0xf0bd91));hd.position.set(sx,2.02,rz);cart.add(hd);
      for(const ax of [-.22,.22]){
        const arm=new THREE.Mesh(new THREE.CylinderGeometry(.07,.07,.55,6),M(sh));
        arm.position.set(sx+ax,2.02,rz);arm.rotation.z=ax>0?-.5:.5;cart.add(arm);
      }
    }
  }
  return cart;
}
for(let c=0;c<4;c++){const cart=buildCart(c,c===0);scene.add(cart);train.push(cart)}
train.forEach(t=>t.visible=false);

// ============================== RIDE STATE ==============================
let built=null,riding=false,s=0,v=0,rideT=0,camMode=0,bank=0,clackAcc=0,liftAcc=0,lastScream=0,maxG=0,maxV=0,gSmooth=1,camSnap=true;
let launchPhase=null,waitT=0,lastCount=0,launchAnchor=null; // Kingda Ka staging: roll -> wait -> go
const _m4=new THREE.Matrix4(),_p=new THREE.Vector3(),_x=new THREE.Vector3(),_y=new THREE.Vector3(),_up=new THREE.Vector3(),_t=new THREE.Vector3(),_ta=new THREE.Vector3(),_tb=new THREE.Vector3(),_tl=new THREE.Vector3(),camP=new THREE.Vector3(0,30,60),camL=new THREE.Vector3(0,8,-110);

function posAt(sDist,out){
  const N=built.N;let f=Math.max(0,Math.min(N,(sDist/built.L)*N));
  const i0=Math.min(N-1,Math.floor(f)),fr=f-i0,i1=i0+1;
  return out.copy(built.spaced[i0]).lerp(built.spaced[i1],fr);
}
function sampleAt(sDist){
  posAt(sDist,_p);
  // wide-baseline tangent (±2.5m) so the facing doesn't jitter on rough spots
  posAt(sDist+2.5,_ta);posAt(sDist-2.5,_tb);
  _t.copy(_ta).sub(_tb).normalize();
  const N=built.N;let f=Math.max(0,Math.min(N,(sDist/built.L)*N));
  const i0=Math.min(N-1,Math.floor(f)),fr=f-i0,i1=i0+1;
  _up.copy(built.UP[i0]).lerp(built.UP[i1],fr).normalize();
  return i0;
}
function slopeAt(sDist){
  const N=built.N;let f=Math.max(0,Math.min(N,(sDist/built.L)*N));
  const i0=Math.floor(f);
  const a=built.spaced[Math.max(0,i0-4)],b=built.spaced[Math.min(N,i0+4)];
  return (b.y-a.y)/(8*built.ds);
}
function startRide(def){
  initAudio();
  try{
    if(built&&built.group&&built.group.parent)scene.remove(built.group);
    built=computeTrack(def);
    scene.add(buildMeshes(built));
  }catch(err){alert("Couldn't load this coaster: "+err.message);return}
  s=3*3.4;v=0;rideT=0;bank=0;maxG=0;maxV=0;camSnap=true;gSmooth=1;$("done").style.display="none";
  launchPhase=def.launch?"roll":null;waitT=0;lastCount=0;launchAnchor=null;
  train.forEach(t=>t.visible=true);
  if(def.launch){tone(80,1400,3,"sawtooth",.18);setTimeout(()=>tone(60,300,2.5,"square",.12),200)}
  riding=true;
  $("menu").classList.add("hidden");
}
function stopRide(){riding=false;$("menu").classList.remove("hidden");$("done").style.display="none"}
function launchCountdown(t){
  const el=$("launchMsg");
  if(t<1.2){el.textContent="🟢 ARMS DOWN — HEAD BACK!";return}
  const n=Math.ceil(3.5-t);
  if(n>=1&&n!==lastCount){lastCount=n;el.textContent=n+"...";tone(440+n*110,440+n*110,.15,"square",.15)}
  if(t>=3.4){el.textContent="🚀 LAUNCH!!";tone(80,1400,2.5,"sawtooth",.18)}
}
function finishRide(){
  riding=false;
  $("doneStats").innerHTML="⏱ Time: "+Math.round(rideT)+"s<br>🚀 Top speed: "+Math.round(maxV*3.6)+" km/h<br>🌀 Max G: "+maxG.toFixed(1)+"g";
  $("done").style.display="grid";
  tone(523,784,.3);setTimeout(()=>tone(659,988,.3),150);setTimeout(()=>tone(784,1319,.5),300);
}

$("stopBtn").onclick=stopRide;
$("doneBtn").onclick=()=>{$("done").style.display="none";stopRide()};
$("camBtn").onclick=()=>{camMode=(camMode+1)%2;toastCam()};
$("soundBtn").onclick=()=>{soundOn=!soundOn;$("soundBtn").textContent=soundOn?"🔊 SOUND":"🔇 MUTED";if(windGain)windGain.gain.value=0};
function toastCam(){}

// menu cards
$("cards").innerHTML=COASTERS.map((c,i)=>{
  const tmp=computeTrack(c);
  return `<div class="card"><h2>${c.name}</h2><div class="type">${c.type}</div>
  <p>${c.desc}</p>
  <div class="stats">📏 ${Math.round(tmp.len)}m long • ⛰ ${tmp.maxH.toFixed(0)}m tall • 🔄 ${tmp.inv} inversions • ${c.thrill}</div>
  <button onclick="ride(${i})">RIDE!</button></div>`;
}).join("");
window.ride=i=>startRide(COASTERS[i]);

// ============================== LOOP ==============================
let last=performance.now();
function loop(now){
  requestAnimationFrame(loop);
  const dt=Math.min((now-last)/1000,.033);last=now;
  if(!riding||!built){
    // idle: slow orbit around park
    const t=now*.00005;
    camera.position.set(Math.sin(t)*90,35,Math.cos(t)*90-100);
    camera.up.set(0,1,0);
    camera.lookAt(0,8,-110);
    renderer.render(scene,camera);return;
  }
  // --- physics along track (substepped so steep drops stay stable) ---
  const steps=Math.max(1,Math.ceil(dt/.008)),h=dt/steps;
  let dyds=0;
  for(let st=0;st<steps;st++){
    dyds=slopeAt(s);
    v+=(-9.81*dyds-0.02*v-0.3)*h;
    if(!built.launch&&s<built.sLift)v=Math.max(v,built.lift); // chain/cable lift
    if(built.launch){
      if(launchPhase==="roll"){v+=(8-v)*Math.min(1,dt*2);if(s>=40){launchPhase="wait";waitT=0;lastCount=0;v=0}}
      else if(launchPhase==="wait"){v=0;waitT+=dt;launchCountdown(waitT);if(waitT>=3.5){launchPhase="go"}}
      else v+=(built.launch.target-v)*Math.min(1,dt*0.9); // hydraulic launch
    }
    v=Math.max(4,Math.min(40,v));if(v>maxV)maxV=v; // no rollback, calmer top speed
    s=(s+v*h)%built.L;
  }
  if(s>built.L-80)v=Math.min(v,Math.max(5,4+(built.L-s)*.18)); // brake run into the terminus
  if(s>=built.L-3){finishRide();return}
  rideT+=dt;
  const i0=sampleAt(s);
  // banking from lateral curvature (wide baseline = no twitching)
  const iA=Math.max(0,i0-12),iB=Math.min(built.N,i0+12);
  const lat=built.T[iB].clone().sub(built.T[iA]).dot(built.SIDE[i0])/(24*built.ds);
  const bankT=Math.max(-1.05,Math.min(1.05,Math.atan(v*v*lat/9.81)));
  bank+=(bankT-bank)*Math.min(1,dt*4);
  // g-force estimate (smoothed for the HUD)
  const k=built.T[iA].angleTo(built.T[iB])/(24*built.ds);
  const g=1+v*v*k/9.81;if(g>maxG)maxG=g;
  gSmooth+=(g-gSmooth)*Math.min(1,dt*6);
  // --- train cars ---
  const gap=3.4;
  const calm=(built.launch&&s<built.launch.until+20)?0:1; // no twirl rattle on the launch straight
  for(let c=0;c<train.length;c++){
    const sc=Math.max(0,s-c*gap);
    const ii=sampleAt(sc);
    const upR=_up.clone().applyAxisAngle(_t,bank);
    _x.crossVectors(upR,_t).normalize();
    _y.crossVectors(_t,_x).normalize();
    _m4.makeBasis(_x,_y,_t);
    train[c].quaternion.setFromRotationMatrix(_m4);
    train[c].position.copy(_p);
    train[c].rotateZ(Math.sin(rideT*13+c*1.7)*Math.min(.05,v/46*.08)*calm); // rail rattle sway
    train[c].position.y+=Math.sin(rideT*17+c*2.3)*Math.min(.06,v/46*.1);
  }
  // --- camera (damped so bumps don't whip your view) ---
  sampleAt(s);
  _tb.copy(_p).addScaledVector(_up,2.3); // rider head
  const lookDist=12+v*.4;
  const inLaunchView=riding&&built&&built.launch&&s<175;
  if(inLaunchView){
    // trackside launch cam: parked ahead, watching the nose come at you
    if(!launchAnchor){
      posAt(70,_ta);
      const sd=new THREE.Vector3().crossVectors(_t,new THREE.Vector3(0,1,0)).normalize();
      launchAnchor=_ta.clone().addScaledVector(sd,11);launchAnchor.y+=5;
    }
    _ta.copy(launchAnchor);
    _tl.copy(_p).addScaledVector(_up,1.5);
    camera.up.set(0,1,0); // dead level horizon on the straight
  }else if(camMode===0){
    _ta.copy(_tb);
    _tl.copy(_p).addScaledVector(_t,lookDist).addScaledVector(_up,.5);
  }else{
    _ta.copy(_p).addScaledVector(_t,-10-v*.15).addScaledVector(_up,4.5);
    _tl.copy(_p).addScaledVector(_up,1).addScaledVector(_t,6);
  }
  _x.copy(_up).applyAxisAngle(_t,bank);
  camera.up.copy(camMode===0?_x:_y.set(0,1,0)); // roll with the track in first person
  if(camSnap){camP.copy(_ta);camL.copy(_tl);camSnap=false}
  camP.lerp(_ta,1-Math.exp(-dt*7));
  if(camP.y<1)camP.y=1; // never clip under the ground
  camL.lerp(_tl,1-Math.exp(-dt*10));
  camera.position.copy(camP);
  camera.lookAt(camL);
  // launch staging banner
  const lm=$("launchMsg");
  if(riding&&built&&built.launch&&launchPhase){
    lm.style.display="block";
    if(launchPhase==="go"&&s<built.launch.until+40)lm.textContent="🚀 LAUNCH!!";
    else if(launchPhase!=="wait")lm.style.display="none";
  }else lm.style.display="none";
  // --- sounds ---
  if(windGain){
    const w=soundOn?Math.min(.5,(v/46)*(v/46)*.6):0;
    windGain.gain.value+=(w-windGain.gain.value)*Math.min(1,dt*5);
    windFilter.frequency.value=300+v*35;
  }
  clackAcc+=v*dt;
  if(clackAcc>12.5){clackAcc=0;if(soundOn)clack()}
  if(!built.launch&&s<built.sLift){liftAcc+=dt;if(liftAcc>.35){liftAcc=0;if(soundOn)chainRattle()}}
  if(dyds<-.45&&v>22&&now-lastScream>2800){lastScream=now;if(soundOn)scream()}
  // --- HUD ---
  $("speed").textContent=Math.round(v*3.6)+" km/h";
  $("cheight").textContent=Math.round(_p.y)+"m";
  $("gforce").textContent=gSmooth.toFixed(1)+"g";
  $("rtime").textContent=Math.round(rideT)+"s";
  renderer.render(scene,camera);
}
requestAnimationFrame(loop);
</script>
</body>
</html>
